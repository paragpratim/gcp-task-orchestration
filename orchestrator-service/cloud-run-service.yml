apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: task-orchestration-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/network-interfaces: '[{"network":"projects/${PROJECT_ID}/global/networks/orchestrator-vpc","subnetwork":"projects/${PROJECT_ID}/regions/${REGION}/subnetworks/orchestrator-subnet"}]'
        run.googleapis.com/vpc-access-egress: all-traffic
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: task-orchestration-api
          image: ${ARTIFACT_REGISTRY}/task-orchestration-api:latest
          env:
            - name: APP_ENV
              value: ${APP_ENV}
            - name: GCP_PROJECT_ID
              value: ${PROJECT_ID}
            - name: GCP_REGION
              value: ${REGION}
            - name: FIRESTORE_DB
              value: ${FIRESTORE_DB}
            - name: QUEUE_SERVICE_ACCOUNT
              value: svc-cr-task-dispatcher@${PROJECT_ID}.iam.gserviceaccount.com
            - name: QUEUE_BASE_URL
              value: ${QUEUE_BASE_URL}
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /api/v1/intake/health
              port: 8080
            initialDelaySeconds: 30
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/v1/intake/health
              port: 8080
            initialDelaySeconds: 45
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 3
      serviceAccountName: svc-cr-task-orchestrator@${PROJECT_ID}.iam.gserviceaccount.com
