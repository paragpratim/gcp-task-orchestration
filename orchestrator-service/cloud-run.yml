apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: task-orchestration-app
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/network-interfaces: '[{"network":"projects/${PROJECT_ID}/global/networks/orchestrator-vpc","subnetwork":"projects/${PROJECT_ID}/regions/${REGION}/subnetworks/orchestrator-subnet"}]'
        run.googleapis.com/vpc-access-egress: all-traffic
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - name: task-orchestration-backend
        image: ${ARTIFACT_REGISTRY}/task-orchestration-app:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "512Mi"
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 45
          timeoutSeconds: 10
          periodSeconds: 30
          failureThreshold: 3
      serviceAccountName: svc-cr-task-orchestrator@${PROJECT_ID}.iam.gserviceaccount.com