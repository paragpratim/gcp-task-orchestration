name: Deploy Task Orchestration Service to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'orchestrator-service/**'
      - 'orchestrator-ui/**'
      - '.github/workflows/deploy-task-orchestration-app.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (leave empty for git SHA)'
        required: false
        type: string
      app_env:
        description: 'Application environment'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - staging
          - prod

env:
  PROJECT_ID: ${{ secrets.TASK_ORCHESTRATION_PROJECT_ID }}
  REGION: europe-west1
  ARTIFACT_REGISTRY: europe-west1-docker.pkg.dev/${{ secrets.TASK_ORCHESTRATION_PROJECT_ID }}/task-orchestrator
  APP_ENV: ${{ github.event.inputs.app_env || 'dev' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          if [ "${{ github.event.inputs.image_tag }}" != "" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "Using custom image tag: ${{ github.event.inputs.image_tag }}"
          else
            echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "Using git SHA as image tag: ${{ github.sha }}"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ secrets.DEPLOYMENT_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_NAME }}/providers/${{ secrets.WIF_PROVIDER_NAME }}'
          service_account: ${{ secrets.DEPLOYMENT_SVC }}
          audience: ${{ secrets.WIF_AUDIENCE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install gcloud beta components
        run: |
          gcloud components install beta --quiet

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: orchestrator-service/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: orchestrator-ui/package-lock.json
      
      - name: Install backend dependencies
        run: go mod download
        working-directory: orchestrator-service

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: orchestrator-service
          args: --timeout=5m

      - name: Build go backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/orchestrator-service ./cmd/api
        working-directory: orchestrator-service

      - name: Build React frontend
        run: |
          cd orchestrator-ui
          npm ci
          npm run build

      - name: Test
        run: go test -v ./...
        working-directory: orchestrator-service

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push UI image
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.IMAGE_TAG }}
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/task-orchestration-ui:${{ env.IMAGE_TAG }} \
                       -t ${{ env.ARTIFACT_REGISTRY }}/task-orchestration-ui:latest \
                       ./orchestrator-ui
          docker push ${{ env.ARTIFACT_REGISTRY }}/task-orchestration-ui:${{ env.IMAGE_TAG }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/task-orchestration-ui:latest

      - name: Build and push backend image
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.IMAGE_TAG }}
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/task-orchestration-api:${{ env.IMAGE_TAG }} \
                       -t ${{ env.ARTIFACT_REGISTRY }}/task-orchestration-api:latest \
                       ./orchestrator-service
          docker push ${{ env.ARTIFACT_REGISTRY }}/task-orchestration-api:${{ env.IMAGE_TAG }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/task-orchestration-api:latest

      - name: Update Cloud Run service YAML [orchestrator-service] with environment variables and image tags
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.IMAGE_TAG }}
          APP_ENV: ${{ github.event.inputs.app_env || env.APP_ENV || 'dev' }}
          GCP_PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          FIRESTORE_DB: orchestrator
          QUEUE_BASE_URL: "" # Add this if using Private DNS
          QUEUE_SERVICE_ACCOUNT: svc-cr-task-dispatcher@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          cp orchestrator-service/cloud-run-service.yml cloud-run-service-deploy.yml

          envsubst < cloud-run-service-deploy.yml > cloud-run-service-final.yml
          mv cloud-run-service-final.yml cloud-run-service-deploy.yml

          sed -i "s|task-orchestration-api:latest|task-orchestration-api:${{ env.IMAGE_TAG }}|g" cloud-run-service-deploy.yml

          echo "Updated YAML file:"
          cat cloud-run-service-deploy.yml

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run services replace cloud-run-service-deploy.yml --region=${{ env.REGION }}

      - name: Get Backend service URL
        id: get-backend-url
        run: |
          BACKEND_SERVICE_URL=$(gcloud run services describe task-orchestration-api --region=${{ env.REGION }} --format="value(status.url)")
          echo "BACKEND_SERVICE_URL=$BACKEND_SERVICE_URL" >> $GITHUB_OUTPUT
          echo "🚀 Backend service deployed at: $BACKEND_SERVICE_URL"
      
      - name: Update Cloud Run service YAML [orchestrator-ui] with environment variables and image tags
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.IMAGE_TAG }}
          APP_ENV: ${{ github.event.inputs.app_env || env.APP_ENV || 'dev' }}
          GCP_PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          BACKEND_URL: ${{ steps.get-backend-url.outputs.BACKEND_SERVICE_URL }}
        run: |
          cp orchestrator-ui/cloud-run-ui.yml cloud-run-ui-deploy.yml

          envsubst < cloud-run-ui-deploy.yml > cloud-run-ui-final.yml
          mv cloud-run-ui-final.yml cloud-run-ui-deploy.yml

          sed -i "s|task-orchestration-ui:latest|task-orchestration-ui:${{ env.IMAGE_TAG }}|g" cloud-run-ui-deploy.yml

          echo "Updated YAML file:"
          cat cloud-run-ui-deploy.yml

      - name: Deploy UI to Cloud Run
        run: |
          gcloud run services replace cloud-run-ui-deploy.yml --region=${{ env.REGION }}

      - name: Configure Cloud Run [orchestrator-ui] for IAP
        run: |
          echo "Enabling IAP for task-orchestration-ui..."
          gcloud beta run services update task-orchestration-ui \
          --region=${{ env.REGION }} \
          --iap

          echo "Getting project number..."
          PROJECT_NUMBER=$(gcloud projects describe ${{ env.PROJECT_ID }} --format="value(projectNumber)")

          echo "Grant invoker permission to the IAP service agent..."
          gcloud run services add-iam-policy-binding task-orchestration-ui \
            --region=${{ env.REGION }} \
            --member="serviceAccount:service-${PROJECT_NUMBER}@gcp-sa-iap.iam.gserviceaccount.com" \
            --role="roles/run.invoker"

      - name: Grant task dispatcher service account Cloud Run invoker access
        run: |
          echo "Granting Cloud Run invoker permission to the task dispatcher service account..."
          gcloud run services add-iam-policy-binding task-orchestration-api \
            --region=${{ env.REGION }} \
            --member="serviceAccount:svc-cr-task-dispatcher@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/run.invoker"

      - name: Get service URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe task-orchestration-ui --region=${{ env.REGION }} --format="value(status.url)")
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "🚀 Service deployed at: $SERVICE_URL"

      - name: Output deployment info
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.IMAGE_TAG }}
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Branch/Ref:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Image Tag:** \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Backend Image:** \`${{ env.ARTIFACT_REGISTRY }}/task-orchestration-api:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🌐 Application URLs" >> $GITHUB_STEP_SUMMARY
          echo "📚 **API Documentation (Swagger UI):** [${{ steps.get-url.outputs.SERVICE_URL }}/swagger/swagger-ui/index.html](${{ steps.get-url.outputs.SERVICE_URL }}/swagger/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** These URLs are protected by Google Cloud IAP and require authentication." >> $GITHUB_STEP_SUMMARY

    outputs:
      service_url: ${{ steps.get-url.outputs.SERVICE_URL }}
      image_tag: ${{ steps.set-tag.outputs.IMAGE_TAG }}

  post-deploy:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always() && needs.build-and-deploy.result == 'success'
    
    steps:
      - name: Notify deployment success
        run: |
          echo "🎉 Task Orchestration Application successfully deployed!"
          echo ""
          echo "📋 **Deployment Details:**"
          echo "   - Trigger: ${{ github.event_name }}"
          echo "   - Image Tag: ${{ needs.build-and-deploy.outputs.image_tag }}"
          echo ""
          echo "🌐 **Application URLs:**"
          echo "   - Frontend: ${{ needs.build-and-deploy.outputs.service_url }}"
          echo "   - Swagger UI: ${{ needs.build-and-deploy.outputs.service_url }}/swagger/index.html"
          echo ""
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "✅ Automatic deployment triggered by push to main branch"
          else
            echo "✅ Manual deployment triggered via workflow_dispatch"
          fi
          echo ""
          echo "🔐 Note: All URLs require IAP authentication"