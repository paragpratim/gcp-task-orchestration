name: Cleanup Task Orchestration Resources

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to destroy'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  PROJECT_ID: ${{ secrets.TASK_ORCHESTRATION_PROJECT_ID }}
  REGION: europe-west1
  API_SERVICE_NAME: task-orchestration-api
  UI_SERVICE_NAME: task-orchestration-ui
  TARGET_ENV: ${{ github.event.inputs.env || 'dev' }}

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ secrets.DEPLOYMENT_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_NAME }}/providers/${{ secrets.WIF_PROVIDER_NAME }}'
          service_account: ${{ secrets.DEPLOYMENT_SVC }}
          audience: ${{ secrets.WIF_AUDIENCE }}
          project_id: ${{ env.PROJECT_ID }}
          create_credentials_file: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Delete Cloud Run services
        run: |
          set -e

          for service in "${{ env.API_SERVICE_NAME }}" "${{ env.UI_SERVICE_NAME }}"; do
            echo "Deleting Cloud Run service: ${service}"
            gcloud run services delete "${service}" \
              --region="${{ env.REGION }}" \
              --quiet \
              --platform=managed || true
          done

      - name: Wait for Cloud Run serverless reservations to clear
        run: |
          set -e

          for attempt in $(seq 1 12); do
            ADDRESSES=$(gcloud compute addresses list \
              --filter="name~'serverless-ipv4-cloudrun' AND region:(${REGION})" \
              --format="value(name)" 2>/dev/null || true)

            if [ -z "$ADDRESSES" ]; then
              echo "No Cloud Run serverless reserved addresses remain in ${{ env.REGION }}. Proceeding."
              break
            fi

            echo "Cloud Run serverless reserved addresses still present (${attempt}/12):"
            echo "$ADDRESSES"
            echo "Waiting 20s for Cloud Run to release the address reservations..."
            sleep 20
          done

          FINAL_ADDRESSES=$(gcloud compute addresses list \
            --filter="name~'serverless-ipv4-cloudrun' AND region:(${REGION})" \
            --format="value(name)" 2>/dev/null || true)

          if [ -n "$FINAL_ADDRESSES" ]; then
            echo "Cloud Run serverless reserved addresses are still present after waiting."
            echo "$FINAL_ADDRESSES"
            echo "Terraform destroy may still fail until these are released automatically by Cloud Run."
            exit 1
          fi

      - name: Trigger Terraform destroy workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Triggering Terraform destroy for environment: ${{ env.TARGET_ENV }}"
          gh workflow run "Deploy Terraform Infrastructure" \
            --repo "${GH_REPO}" \
            -f action=destroy \
            -f env="${{ env.TARGET_ENV }}"

      - name: Cleanup summary
        run: |
          echo "## Cleanup Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Deleted Cloud Run services: ${{ env.API_SERVICE_NAME }}, ${{ env.UI_SERVICE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Triggered Terraform destroy for environment: ${{ env.TARGET_ENV }}" >> "$GITHUB_STEP_SUMMARY"
